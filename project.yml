name: Currency
options:
  bundleIdPrefix: com.dima
  deploymentTarget:
    iOS: '26.0'
packages:
  RateCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: '1.0'
targets:
  Currency:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: RateCore
      - target: CurrencyWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dima.currency
        INFOPLIST_KEY_CFBundleDisplayName: Currency
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [currency]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/Currency.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dima.currency]
  CurrencyWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: RateCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dima.currency.widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Currency Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Currency.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dima.currency]
