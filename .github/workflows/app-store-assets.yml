name: App Store Draft Assets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect native policy, plan, or apply draft changes (never submit review)
        type: choice
        options: [dry-run, apply, inspect-native-policy, inspect-accessibility, confirm-larger-text]
        default: dry-run
      version_id:
        description: Optional exact editable iOS version ID; blank requires one unique draft
        type: string
        required: false
      version_string:
        description: Optional exact iOS version string to narrow draft discovery
        type: string
        required: false
      app_info_id:
        description: Optional editable app-info ID; blank requires one unique draft
        type: string
        required: false
      scope:
        description: Comma-separated scopes metadata,default,cpp,header,duo
        type: string
        default: metadata,default,cpp,header,duo
        required: true
      replace_header_sha256:
        description: Optional exact previous approved header SHA-256; replaces only matching draft placements
        type: string
        required: false
      duplicate_screenshot_id:
        description: Optional exact screenshot ID; remove only a verified extra copy of an approved image
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: currency-app-store-${{ inputs.mode == 'inspect-native-policy' && 'native-policy-inspection' || 'draft-assets' }}
  cancel-in-progress: false

jobs:
  drafts:
    if: (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/feature/localized-app-store-headers' && github.actor == github.repository_owner)) && inputs.mode != 'inspect-accessibility' && inputs.mode != 'confirm-larger-text'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: testflight
    env:
      ASC_STRICT_AUTH: 'true'
      ASC_APP_ID: '6816213577'
      ASC_UPLOAD_TIMEOUT: '30m'
      REQUEST_MODE: ${{ inputs.mode }}
      TARGET_VERSION_ID: ${{ inputs.version_id }}
      TARGET_VERSION_STRING: ${{ inputs.version_string }}
      TARGET_APP_INFO_ID: ${{ inputs.app_info_id }}
      ASSET_SCOPE: ${{ inputs.scope }}
      REPLACE_HEADER_SHA256: ${{ inputs.replace_header_sha256 }}
      DUPLICATE_SCREENSHOT_ID: ${{ inputs.duplicate_screenshot_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned verified asc and video inspection
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/currency-asc-bin"
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 --retry 2 --retry-max-time 120 \
            https://github.com/rorkai/App-Store-Connect-CLI/releases/download/5.16.0/asc_5.16.0_linux_amd64 \
            --output "$RUNNER_TEMP/currency-asc-bin/asc"
          echo 'f0be6185b82e300899e2c162bae8975cafb3fcd7c6f990b8e22d637184bcaabc  '"$RUNNER_TEMP/currency-asc-bin/asc" | sha256sum --check --status
          chmod 755 "$RUNNER_TEMP/currency-asc-bin/asc"
          echo "$RUNNER_TEMP/currency-asc-bin" >> "$GITHUB_PATH"
          if [[ "$REQUEST_MODE" != inspect-native-policy && ",$ASSET_SCOPE," == *,header,* ]] && ! command -v ffprobe >/dev/null 2>&1; then
            echo 'Refreshing package index for video inspection'
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
            echo 'Installing video inspection dependency'
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y -qq ffmpeg
          fi
      - name: Fetch and verify the pinned asset release
        if: inputs.mode != 'inspect-native-policy'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 Marketing/AppStore/fetch_assets.py \
            --repo "$GH_REPO" --output "$RUNNER_TEMP/currency-app-store-media"
      - name: Validate approved media without API access
        if: inputs.mode != 'inspect-native-policy'
        shell: bash
        run: python3 Marketing/AppStore/upload.py --validate-only --scope "$ASSET_SCOPE" --media-dir "$RUNNER_TEMP/currency-app-store-media"
      - name: Validate request and credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_API_CERT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUEST_MODE" == dry-run || "$REQUEST_MODE" == apply || "$REQUEST_MODE" == inspect-native-policy ]] || exit 1
          if [[ "$REQUEST_MODE" == inspect-native-policy && -n "$DUPLICATE_SCREENSHOT_ID" ]]; then
            echo '::error::Duplicate repair is available only with a reviewed dry-run or apply request'
            exit 1
          fi
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_B64; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required configuration: $name"; exit 1; }
          done
      - name: Inspect policy or plan/apply draft assets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_API_CERT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REQUEST_MODE" == inspect-native-policy ]]; then
            python3 - <<'PY'
          import importlib.util
          import json
          import math
          import re
          import sys
          spec = importlib.util.spec_from_file_location('app_store_upload', 'Marketing/AppStore/upload.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          UploadError = module.UploadError

          def inspect_native_policy(cli):
              identifier = 'identifier'
              integer = 'integer'
              boolean = 'boolean'
              ratio = 'ratio'
              duration = 'duration'
              dimensions = {key: integer for key in ('minWidth', 'maxWidth', 'minHeight', 'maxHeight')}
              specification = {'specId': identifier, 'dimensions': dimensions, 'aspectRatio': ratio, 'compatiblePlacementTypes': [identifier]}
              schema = {
                  'features': [{'featureId': identifier, 'placementPolicies': [{'placementType': identifier, 'groupLimits': [{'groupIds': [identifier], 'maxCount': integer}]}]}],
                  'placementProfileGroups': [{'placementProfileGroupId': identifier, 'platform': identifier, 'displayClassId': identifier}],
                  'placementTypes': [{'placementTypeId': identifier, 'acceptsAssetCategories': [identifier], 'specMappings': [{'placementGroupId': identifier, 'specs': [identifier]}]}],
                  'imageSpecs': [specification],
                  'videoSpecs': [{**specification, 'frameRates': [{'minFps': integer, 'maxFps': integer}], 'duration': {'min': duration, 'max': duration}, 'audioRequired': boolean}],
              }

              def invalid():
                  raise UploadError('Native policy inspection returned invalid reference data (raw output suppressed)')

              def project(value, expected):
                  if isinstance(expected, dict):
                      if not isinstance(value, dict):
                          invalid()
                      return {key: project(value[key], kind) for key, kind in expected.items() if key in value}
                  if isinstance(expected, list):
                      if not isinstance(value, list):
                          invalid()
                      return [project(item, expected[0]) for item in value]
                  if expected == integer:
                      valid = type(value) is int and value >= 0
                  elif expected == boolean:
                      valid = type(value) is bool
                  elif expected == ratio and type(value) in (int, float):
                      valid = 0 < value < 1000 and math.isfinite(value)
                  elif isinstance(value, str) and len(value) <= 160:
                      patterns = {identifier: r'[A-Za-z0-9_.-]{1,160}', ratio: r'[0-9]+(?:\.[0-9]+)?(?:[:/][0-9]+(?:\.[0-9]+)?)?', duration: r'P(?:[0-9]+D)?(?:T(?=[0-9])(?:[0-9]+(?:\.[0-9]+)?H)?(?:[0-9]+(?:\.[0-9]+)?M)?(?:[0-9]+(?:\.[0-9]+)?S)?)?'}
                      valid = re.fullmatch(patterns[expected], value) is not None
                      if expected == ratio:
                          valid = valid and all(0 < float(part) < 1000 for part in re.split('[:/]', value))
                      if expected == duration:
                          valid = valid and any(character.isdigit() for character in value)
                  else:
                      valid = False
                  if not valid:
                      invalid()
                  return value

              response = cli.api('GET', '/v1/appAssetLibraryRefData')
              if not isinstance(response, dict):
                  invalid()
              rows = response.get('data')
              if not isinstance(rows, list) or len(rows) != 1 or not isinstance(rows[0], dict):
                  invalid()
              return {'mode': 'inspect-native-policy', 'referenceData': [project(rows[0].get('attributes', {}), schema)]}

          try:
              print(json.dumps(inspect_native_policy(module.CLI(apply=False)), indent=2))
          except UploadError as error:
              sys.exit(str(error))
          PY
            exit 0
          fi
          mode_args=()
          if [[ "$REQUEST_MODE" == apply ]]; then mode_args+=(--apply); fi
          if [[ -n "$REPLACE_HEADER_SHA256" ]]; then mode_args+=(--replace-header-sha256 "$REPLACE_HEADER_SHA256"); fi
          if [[ -n "$DUPLICATE_SCREENSHOT_ID" ]]; then mode_args+=(--remove-approved-duplicate "$DUPLICATE_SCREENSHOT_ID"); fi
          python3 Marketing/AppStore/upload.py \
            --metadata Marketing/AppStore/metadata.json \
            --media-dir "$RUNNER_TEMP/currency-app-store-media" \
            --version-id "$TARGET_VERSION_ID" --version-string "$TARGET_VERSION_STRING" \
            --app-info-id "$TARGET_APP_INFO_ID" --scope "$ASSET_SCOPE" \
            --receipts "$RUNNER_TEMP/currency-app-store-receipts.jsonl" "${mode_args[@]}"
      - name: Preserve sanitized draft operation receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: currency-app-store-draft-receipts
          path: ${{ runner.temp }}/currency-app-store-receipts.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove unpacked media
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/currency-app-store-media"

  accessibility-confirmation:
    if: github.ref == 'refs/heads/feature/localized-app-store-headers' && github.actor == github.repository_owner && (inputs.mode == 'inspect-accessibility' || inputs.mode == 'confirm-larger-text')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testflight
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install verified asc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/currency-asc-bin"
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 --retry 2 --retry-max-time 120 https://github.com/rorkai/App-Store-Connect-CLI/releases/download/5.16.0/asc_5.16.0_linux_amd64 --output "$RUNNER_TEMP/currency-asc-bin/asc"
          echo 'f0be6185b82e300899e2c162bae8975cafb3fcd7c6f990b8e22d637184bcaabc  '"$RUNNER_TEMP/currency-asc-bin/asc" | sha256sum --check --status
          chmod 755 "$RUNNER_TEMP/currency-asc-bin/asc"
          echo "$RUNNER_TEMP/currency-asc-bin" >> "$GITHUB_PATH"
      - name: Inspect or confirm existing draft Larger Text declarations
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_API_CERT }}
          REQUEST_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import importlib.util
          import json
          import os
          import re
          import sys
          spec = importlib.util.spec_from_file_location('upload', 'Marketing/AppStore/upload.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          try:
              apply = os.environ['REQUEST_MODE'] == 'confirm-larger-text'
              cli = module.CLI(apply=apply)
              path = '/v1/apps/6816213577/accessibilityDeclarations'
              def read():
                  rows = cli.api('GET', path)['data']
                  assert isinstance(rows, list)
                  families = [row['attributes']['deviceFamily'] for row in rows]
                  assert len(families) == len(set(families))
                  return {row['attributes']['deviceFamily']: row for row in rows}
              before = read()
              assert {'IPHONE', 'IPAD'} <= before.keys()
              print(json.dumps({'mode': os.environ['REQUEST_MODE'], 'before': {family: row['attributes'] for family, row in before.items()}}), flush=True)
              for family in ('IPHONE', 'IPAD'):
                  row = before[family]
                  assert row['attributes']['state'] == 'DRAFT'
                  identifier = row['id']
                  assert isinstance(identifier, str) and re.fullmatch('[A-Za-z0-9-]+', identifier)
                  if apply and row['attributes'].get('supportsLargerText') is not True:
                      cli.api('PATCH', '/v1/accessibilityDeclarations/' + identifier, {'data': {'type': 'accessibilityDeclarations', 'id': identifier, 'attributes': {'supportsLargerText': True}}})
              after = read()
              assert before.keys() == after.keys()
              for family, row in before.items():
                  expected = dict(row['attributes'])
                  if apply and family in ('IPHONE', 'IPAD'):
                      expected['supportsLargerText'] = True
                  assert after[family]['attributes'] == expected
              print(json.dumps({'verified': True, 'after': {family: row['attributes'] for family, row in after.items()}}), flush=True)
          except module.UploadError as error:
              print(str(error), file=sys.stderr)
              sys.exit(1)
          except (AssertionError, KeyError, ValueError, TypeError):
              print('Declaration guard or readback failed; inspect existing draft state before retrying.', file=sys.stderr)
              sys.exit(1)
          PYTHON
