name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      xcode: ${{ steps.changes.outputs.xcode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash Scripts/CI/changes.sh "$BASE_SHA"
      - name: Check release automation
        run: |
          for script in Scripts/CI/*.sh; do bash -n "$script"; done
          python3 Scripts/CI/test_release_configuration.py
      - name: Check localization coverage and placeholders
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import subprocess
          subprocess.run(["python3", "Scripts/CI/test_check_localizations.py"], check=True, timeout=25)
          subprocess.run(["python3", "Scripts/CI/check_localizations.py"], check=True, timeout=25)
          PYTHON
      - name: Test CI skip rules
        run: |
          python3 Scripts/CI/test_skip_rules.py
          python3 Scripts/CI/test_project_structure.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check E2E integration types
        working-directory: Apps/Currency/Tests/E2E
        run: |
          npm ci
          npm run typecheck
      - name: Test TestFlight notes
        run: python3 Scripts/CI/test_testflight_notes.py
      - name: Record release decision
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: currency-release-request
          path: ${{ runner.temp }}/ShouldPublish.txt
          if-no-files-found: error
  test:
    needs: changes
    if: always()
    runs-on: ${{ needs.changes.outputs.xcode == 'true' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: currency-test-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Require successful change checks
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
        if: needs.changes.outputs.xcode == 'true'
      - name: Isolate Tuist credentials
        if: needs.changes.outputs.xcode == 'true'
        run: |
          config=$(mktemp -d "$RUNNER_TEMP/currency-tuist.XXXXXX")
          echo "TUIST_XDG_CONFIG_HOME=$config" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v4
        if: needs.changes.outputs.xcode == 'true'
      - name: Install build formatter
        if: needs.changes.outputs.xcode == 'true'
        run: brew install xcbeautify
      - name: Check Swift formatting
        if: needs.changes.outputs.xcode == 'true'
        run: swift format lint --recursive --strict Apps AppExtensions Domain Features Foundation
      - name: Install Tuist dependencies
        if: needs.changes.outputs.xcode == 'true'
        run: tuist install
      - name: Warm dependency cache
        if: >-
          needs.changes.outputs.xcode == 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login != 'dependabot[bot]'))
        continue-on-error: true
        run: |
          tuist auth login
          tuist cache --cache-profile all-possible --configuration Debug
      # Warming creates a cache-build workspace; always regenerate before validation.
      - name: Generate project
        if: needs.changes.outputs.xcode == 'true'
        run: |
          tuist generate --no-open --cache-profile none
      - name: Check generated navigator structure
        if: needs.changes.outputs.xcode == 'true'
        run: python3 Scripts/CI/check_project_structure.py
      - name: Create test simulator
        if: needs.changes.outputs.xcode == 'true'
        run: |
          simulator=$(xcrun simctl create \
            "Currency CI $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "CURRENCY_TEST_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
      - name: Test on iOS Simulator
        if: needs.changes.outputs.xcode == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Currency.xcworkspace \
            -scheme CurrencyTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$CURRENCY_TEST_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/CurrencyTestsDerivedData" \
            -collect-test-diagnostics never \
            CODE_SIGN_IDENTITY=- \
            2>&1 | xcbeautify
      - name: Build watchOS 26 app and complications
        if: needs.changes.outputs.xcode == 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Currency.xcworkspace \
            -scheme CurrencyWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CurrencyTestsDerivedData" \
            CODE_SIGN_IDENTITY=- \
            2>&1 | xcbeautify
      - name: Check compiler-extracted localization coverage
        if: needs.changes.outputs.xcode == 'true'
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          subprocess.run(
              ["python3", "Scripts/CI/check_localizations.py", "--strings-data",
               os.path.join(os.environ["RUNNER_TEMP"], "CurrencyTestsDerivedData")],
              check=True, timeout=25)
          PYTHON
      - name: Prepare app launch before native tests
        if: needs.changes.outputs.xcode == 'true'
        run: |
          if xcrun simctl get_app_container "$CURRENCY_TEST_SIMULATOR" com.dimasike.currency app >/dev/null 2>&1; then
            xcrun simctl uninstall "$CURRENCY_TEST_SIMULATOR" com.dimasike.currency
          fi
          xcrun simctl install "$CURRENCY_TEST_SIMULATOR" \
            "$RUNNER_TEMP/CurrencyTestsDerivedData/Build/Products/Debug-iphonesimulator/Currency.app"
          xcrun simctl launch "$CURRENCY_TEST_SIMULATOR" com.dimasike.currency \
            -AppleLanguages '(en)' -AppleLocale en_US
          xcrun simctl terminate "$CURRENCY_TEST_SIMULATOR" com.dimasike.currency
      - name: Test extracted App Intents
        if: needs.changes.outputs.xcode == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Currency.xcworkspace \
            -scheme NativeIntentTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$CURRENCY_TEST_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/CurrencyTestsDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/CurrencyNativeIntents.xcresult" \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$RUNNER_TEMP/CurrencyNativeIntents.log" | xcbeautify
      - name: Build feature harnesses
        if: needs.changes.outputs.xcode == 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Currency.xcworkspace \
            -scheme CurrencyHarnesses \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CurrencyTestsDerivedData" \
            CODE_SIGN_IDENTITY=- \
            2>&1 | xcbeautify
      - name: Capture indexing diagnostics
        if: failure() && env.CURRENCY_TEST_SIMULATOR != ''
        run: |
          xcrun simctl spawn "$CURRENCY_TEST_SIMULATOR" log show \
            --last 30m --style compact --info --debug \
            --predicate 'subsystem CONTAINS[c] "spotlight" OR (subsystem == "com.dimasike.currency" AND category == "Spotlight")' \
            > "$RUNNER_TEMP/CurrencySpotlight.log" 2>&1 || true
      - name: Upload native test diagnostics
        if: failure() && needs.changes.outputs.xcode == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: native-intent-diagnostics
          path: |
            ${{ runner.temp }}/CurrencyNativeIntents.log
            ${{ runner.temp }}/CurrencyNativeIntents.xcresult
            ${{ runner.temp }}/CurrencySpotlight.log
          retention-days: 7
          if-no-files-found: warn
      - name: Remove test simulator
        if: always() && env.CURRENCY_TEST_SIMULATOR != ''
        run: |
          xcrun simctl shutdown "$CURRENCY_TEST_SIMULATOR" || true
          xcrun simctl delete "$CURRENCY_TEST_SIMULATOR"
      - name: Remove Tuist CI credentials
        if: always() && needs.changes.outputs.xcode == 'true'
        run: |
          if [[ -n "${TUIST_XDG_CONFIG_HOME:-}" ]] && command -v tuist >/dev/null 2>&1; then
            tuist auth logout || true
          fi
