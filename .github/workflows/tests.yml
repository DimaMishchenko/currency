name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      xcode: ${{ steps.changes.outputs.xcode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash Scripts/CI/changes.sh "$BASE_SHA"
      - name: Check release automation
        run: for script in Scripts/CI/*.sh; do bash -n "$script"; done
      - name: Test CI skip rules
        run: python3 Scripts/CI/test_skip_rules.py
      - name: Record release decision
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: currency-release-request
          path: ${{ runner.temp }}/ShouldPublish.txt
          if-no-files-found: error
  test:
    needs: changes
    if: always()
    runs-on: ${{ needs.changes.outputs.xcode == 'true' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: currency-test-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Require successful change checks
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v5
        if: needs.changes.outputs.xcode == 'true'
      - name: Isolate Tuist credentials
        if: needs.changes.outputs.xcode == 'true'
        run: |
          config=$(mktemp -d "$RUNNER_TEMP/currency-tuist.XXXXXX")
          echo "TUIST_XDG_CONFIG_HOME=$config" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v4
        if: needs.changes.outputs.xcode == 'true'
      - name: Install build formatter
        if: needs.changes.outputs.xcode == 'true'
        run: brew install xcbeautify
      - name: Check Swift formatting
        if: needs.changes.outputs.xcode == 'true'
        run: swift format lint --recursive --strict App Domain Features DesignSystem Infrastructure
      - name: Install Tuist dependencies
        if: needs.changes.outputs.xcode == 'true'
        run: tuist install
      - name: Warm dependency cache
        if: >-
          needs.changes.outputs.xcode == 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login != 'dependabot[bot]'))
        continue-on-error: true
        run: |
          tuist auth login
          tuist cache --cache-profile only-external --configuration Debug
      # Warming creates a cache-build workspace; always regenerate before validation.
      - name: Generate project
        if: needs.changes.outputs.xcode == 'true'
        run: |
          tuist generate --no-open || tuist generate --no-open --cache-profile none
      - name: Create test simulator
        if: needs.changes.outputs.xcode == 'true'
        run: |
          simulator=$(xcrun simctl create \
            "Currency CI $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "CURRENCY_TEST_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
      - name: Test on iOS Simulator
        if: needs.changes.outputs.xcode == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Currency.xcworkspace \
            -scheme CurrencyTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$CURRENCY_TEST_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/CurrencyTestsDerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- \
            2>&1 | xcbeautify
      - name: Test extracted App Intents
        if: needs.changes.outputs.xcode == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Currency.xcworkspace \
            -scheme NativeIntentTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$CURRENCY_TEST_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/CurrencyTestsDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/CurrencyNativeIntents.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$RUNNER_TEMP/CurrencyNativeIntents.log" | xcbeautify
      - name: Build feature harnesses
        if: needs.changes.outputs.xcode == 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Currency.xcworkspace \
            -scheme CurrencyHarnesses \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CurrencyTestsDerivedData" \
            CODE_SIGN_IDENTITY=- \
            2>&1 | xcbeautify
      - name: Capture indexing diagnostics
        if: failure() && env.CURRENCY_TEST_SIMULATOR != ''
        run: |
          xcrun simctl spawn "$CURRENCY_TEST_SIMULATOR" log show \
            --last 30m --style compact --info --debug \
            --predicate 'subsystem CONTAINS[c] "spotlight" OR (subsystem == "com.dimasike.currency" AND category == "Spotlight")' \
            > "$RUNNER_TEMP/CurrencySpotlight.log" 2>&1 || true
      - name: Upload native test diagnostics
        if: failure() && needs.changes.outputs.xcode == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-intent-diagnostics
          path: |
            ${{ runner.temp }}/CurrencyNativeIntents.log
            ${{ runner.temp }}/CurrencyNativeIntents.xcresult
            ${{ runner.temp }}/CurrencySpotlight.log
          retention-days: 7
          if-no-files-found: warn
      - name: Remove test simulator
        if: always() && env.CURRENCY_TEST_SIMULATOR != ''
        run: |
          xcrun simctl shutdown "$CURRENCY_TEST_SIMULATOR" || true
          xcrun simctl delete "$CURRENCY_TEST_SIMULATOR"
      - name: Remove Tuist CI credentials
        if: always() && needs.changes.outputs.xcode == 'true'
        run: |
          if [[ -n "${TUIST_XDG_CONFIG_HOME:-}" ]] && command -v tuist >/dev/null 2>&1; then
            tuist auth logout || true
          fi
