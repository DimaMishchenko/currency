name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      xcode: ${{ steps.changes.outputs.xcode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash Scripts/CI/changes.sh "$BASE_SHA"
      - name: Check release automation
        run: for script in Scripts/CI/*.sh; do bash -n "$script"; done
      - name: Test CI skip rules
        run: python3 Scripts/CI/test_skip_rules.py
      - name: Record release decision
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: currency-release-request
          path: ${{ runner.temp }}/ShouldPublish.txt
          if-no-files-found: error
  test:
    needs: changes
    if: always()
    runs-on: ${{ needs.changes.outputs.xcode == 'true' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 60
    concurrency:
      group: currency-test-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Require successful change checks
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v5
        if: needs.changes.outputs.xcode == 'true'
      - name: Install tools
        if: needs.changes.outputs.xcode == 'true'
        run: brew install tuist xcbeautify
      - name: Check Swift formatting
        if: needs.changes.outputs.xcode == 'true'
        run: swift format lint --recursive --strict App Domain Features DesignSystem Infrastructure
      - name: Test standalone rate core
        if: needs.changes.outputs.xcode == 'true'
        run: swift test
      - name: Generate project
        if: needs.changes.outputs.xcode == 'true'
        run: tuist generate --no-open
      - name: Test on iOS Simulator
        if: needs.changes.outputs.xcode == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Currency.xcworkspace \
            -scheme CurrencyTests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -derivedDataPath "$RUNNER_TEMP/CurrencyTestsDerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- \
            2>&1 | xcbeautify
      - name: Build feature harnesses
        if: needs.changes.outputs.xcode == 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Currency.xcworkspace \
            -scheme CurrencyHarnesses \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CurrencyTestsDerivedData" \
            CODE_SIGN_IDENTITY=- \
            2>&1 | xcbeautify
