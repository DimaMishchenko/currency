name: TestFlight Publish

on:
  workflow_run:
    workflows: [iOS Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  testflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 90
    environment: testflight
    concurrency:
      group: currency-testflight-main
      queue: max
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      APPLE_TEAM_ID: '77X75EH6F4'
      ASC_APP_ID: '6816213577'
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_API_CERT }}
      APPLE_DISTRIBUTION_PRIVATE_KEY_B64: ${{ secrets.APPLE_DISTRIBUTION_PRIVATE_KEY_B64 }}
      ASC_STRICT_AUTH: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check release configuration
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_B64 APPLE_DISTRIBUTION_PRIVATE_KEY_B64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing testflight environment value: $name"
              exit 1
            fi
          done
      - name: Install tools
        run: brew install tuist xcbeautify asc
      - name: Allocate build number
        run: bash Scripts/CI/release.sh allocate
      - name: Prepare certificate and profiles
        run: bash Scripts/CI/signing.sh
      - name: Generate signed project
        run: |
          TUIST_CURRENCY_APP_PROFILE_UUID="$CURRENCY_APP_PROFILE_UUID" \
          TUIST_CURRENCY_WIDGET_PROFILE_UUID="$CURRENCY_WIDGET_PROFILE_UUID" \
            tuist generate --no-open
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Currency.xcworkspace \
            -scheme Currency \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CurrencyReleaseDerivedData" \
            -archivePath "$RUNNER_TEMP/Currency.xcarchive" \
            "CURRENT_PROJECT_VERSION=$CURRENCY_BUILD_NUMBER" \
            2>&1 | xcbeautify
      - name: Export IPA
        run: |
          bash Scripts/CI/release.sh export-options "$RUNNER_TEMP/ExportOptions.plist"
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Currency.xcarchive" \
            -exportPath "$RUNNER_TEMP/CurrencyExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | xcbeautify
      - name: Verify signed IPA
        run: bash Scripts/CI/verify_ipa.sh "$RUNNER_TEMP/CurrencyExport/Currency.ipa"
      - name: Upload to TestFlight
        run: bash Scripts/CI/release.sh upload "$RUNNER_TEMP/CurrencyExport/Currency.ipa"
      - name: Remove temporary signing assets
        if: always()
        run: |
          if [[ -n "${CURRENCY_SIGNING_DIR:-}" ]]; then
            security delete-keychain "$CURRENCY_SIGNING_DIR/currency-ci.keychain-db" || true
            rm -rf "$CURRENCY_SIGNING_DIR"
          fi
